name: GSC Next Build
on:
  push:
    paths: ['.github/workflows/gsc-next-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build modular preview
        shell: python
        run: |
          from pathlib import Path
          import json
          Path("next").mkdir(exist_ok=True)
          cfg={"version":"next-2","droneScenes":[
            {"id":"gate","title":"Cổng chính","src":"https://drive.google.com/file/d/18r8ADfI6NKrLKOkTheuJ91fBnifbYgNJ/preview"},
            {"id":"reception","title":"Reception","src":"https://drive.google.com/file/d/1ZAhZ67i4lBJsu3fVxPQNYd8AKJ9L3sKF/preview"},
            {"id":"koi","title":"Hồ Koi","src":"https://drive.google.com/file/d/1cZVjsaQUPYN89IEI4u0L-wt9-ndaKzmN/preview"},
            {"id":"wellness","title":"Wellness","src":"https://drive.google.com/file/d/1lqFuUTKKf9A0w4g04F2aB2OpRJdT42N8/preview"},
            {"id":"pool","title":"Hồ bơi","src":"https://drive.google.com/file/d/1OgiVVHld9esVkVO2QgwCNdVMKmhVzcSF/preview"},
            {"id":"towers","title":"Hai tháp","src":"https://drive.google.com/file/d/1BMgtO93Kwr90AdS9uH0ueGAv5DHdX0E4/preview"},
            {"id":"rooftop","title":"Sân thượng","src":"https://drive.google.com/file/d/1g0mAVPZzEMeLk1QSDyX6gLhwMIqg-Qfm/preview"}]}
          Path("next/config.json").write_text(json.dumps(cfg,ensure_ascii=False,indent=2),encoding="utf-8")
          html=r'''<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GSC Next</title><style>
          *{box-sizing:border-box}body{margin:0;background:#06100e;color:#f5f4ef;font:14px Segoe UI,Arial;overflow:hidden}.app{height:100dvh;display:grid;grid-template-columns:76px 1fr}.rail{border-right:1px solid #ffffff14;background:#081512;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:10px}.logo{color:#d8bd70;font-weight:900;margin:5px 0 18px}.rail button{width:52px;height:52px;border:1px solid transparent;border-radius:12px;background:transparent;color:#9caaa5;font-size:20px}.rail button.on,.rail button:hover{background:#d8bd7014;border-color:#d8bd7033;color:#e5cb83}.main{position:relative;overflow:hidden}.hero{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#17302a,#07110f 60%);display:flex;align-items:center;justify-content:center}.heroBox{text-align:center;max-width:780px;padding:30px}.eyebrow{color:#d8bd70;letter-spacing:.22em;font-size:11px}.hero h1{font-size:clamp(38px,7vw,82px);line-height:.95;margin:14px 0}.hero p{color:#aebbb6;font-size:clamp(14px,2vw,18px)}.cta{margin:18px 5px 0;padding:12px 17px;border-radius:999px;border:1px solid #d8bd7055;background:#d8bd7014;color:#e8d18e}.panel{position:absolute;inset:0;background:#07110f;display:none;padding:24px;overflow:auto}.panel.on{display:block}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.top h2{margin:0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#0b1916;border:1px solid #ffffff12;border-radius:16px;padding:16px}.card b{color:#ddc47c}.card p{color:#91a09b;font-size:12px}.tour{display:grid;grid-template-columns:1.7fr .8fr;gap:14px;height:calc(100dvh - 95px)}.screen{border-radius:18px;overflow:hidden;border:1px solid #ffffff14;background:#020403;position:relative}.screen iframe{width:100%;height:100%;border:0}.sceneList{overflow:auto}.scene{width:100%;text-align:left;padding:12px;margin-bottom:8px;border-radius:12px;border:1px solid #ffffff12;background:#0b1916;color:#b8c3bf}.scene.on{border-color:#d8bd7066;color:#e5cb83}.adminGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.status{font-size:11px;color:#76c79b}.hint{color:#778984;font-size:12px}.close{border:1px solid #ffffff1c;background:#ffffff09;color:#fff;border-radius:9px;padding:9px 12px}@media(max-width:720px){.app{grid-template-columns:60px 1fr}.rail{padding:10px 4px}.rail button{width:46px;height:46px}.tour{grid-template-columns:1fr;height:auto}.screen{height:50vh}.cards,.adminGrid{grid-template-columns:1fr}.panel{padding:15px 10px}}
          </style></head><body><div class="app"><aside class="rail"><div class="logo">GSC</div><button class="on" data-v="home" title="Home">⌂</button><button data-v="tour" title="Drone Warp">➤</button><button data-v="twin" title="Digital Twin">◎</button><button data-v="story" title="Presentation">▶</button><button data-v="admin" title="Admin">⚙</button></aside><main class="main">
          <section class="hero" id="home"><div class="heroBox"><div class="eyebrow">GSC SENIOR LIVING & WELLNESS</div><h1>Nơi tuổi vàng bắt đầu một chương mới.</h1><p>Trải nghiệm dự án bằng Digital Twin và hành trình Drone Warp điện ảnh.</p><button class="cta" data-open="tour">BẮT ĐẦU DRONE WARP</button><button class="cta" data-open="twin">MỞ DIGITAL TWIN</button></div></section>
          <section class="panel" id="tour"><div class="top"><div><span class="eyebrow">CINEMATIC EXPERIENCE</span><h2>Drone Warp Tour</h2></div><button class="close" data-open="home">Đóng</button></div><div class="tour"><div class="screen"><iframe id="warpFrame" allow="autoplay; fullscreen"></iframe></div><div class="sceneList" id="sceneList"></div></div></section>
          <section class="panel" id="twin"><div class="top"><div><span class="eyebrow">INTERACTIVE MASTERPLAN</span><h2>Digital Twin</h2></div><button class="close" data-open="home">Đóng</button></div><div class="card"><b>Production Digital Twin</b><p>Module này dùng core masterplan/hotspot ổn định hiện tại. Khi Next vượt QA, core sẽ được mount trực tiếp tại đây thay vì chèn patch.</p><span class="status">● CORE READY</span></div></section>
          <section class="panel" id="story"><div class="top"><div><span class="eyebrow">PROJECT STORY</span><h2>Giới thiệu dự án</h2></div><button class="close" data-open="home">Đóng</button></div><div class="cards"><div class="card"><b>01 · Ấn tượng</b><p>Không gian sống mới cho tuổi vàng.</p></div><div class="card"><b>02 · Hiểu dự án</b><p>20.000 m² · hai tháp · 36 tầng.</p></div><div class="card"><b>03 · Khám phá</b><p>Digital Twin và hệ tiện ích.</p></div><div class="card"><b>04 · Tin tưởng</b><p>Chăm sóc sức khỏe đặt ở trung tâm.</p></div><div class="card"><b>05 · Hành động</b><p>Tự khám phá từng không gian.</p></div></div></section>
          <section class="panel" id="admin"><div class="top"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h2>GSC Admin</h2></div><button class="close" data-open="home">Đóng</button></div><p class="hint">Giao diện quản trị chỉ hiển thị nghiệp vụ, không hiển thị JSON, tọa độ hay raw Drive URL.</p><div class="adminGrid"><div class="card"><b>Hotspots</b><p>Tên, trạng thái, media, thứ tự hiển thị.</p></div><div class="card"><b>Drone Tour</b><p>Scene, thứ tự, preview và Auto Tour.</p></div><div class="card"><b>Presentation</b><p>Nội dung 5 bước giới thiệu dự án.</p></div><div class="card"><b>Media</b><p>Ảnh/video dùng trong toàn App.</p></div><div class="card"><b>App Settings</b><p>Brand, module, public experience.</p></div><div class="card"><b>Preview & Publish</b><p>Kiểm tra trước khi đưa lên Production.</p></div></div></section>
          </main></div><script>
          let cfg;const panels=[...document.querySelectorAll(".panel")],hero=document.querySelector(".hero");function openView(id){hero.style.display=id==="home"?"flex":"none";panels.forEach(p=>p.classList.toggle("on",p.id===id));document.querySelectorAll(".rail button").forEach(b=>b.classList.toggle("on",b.dataset.v===id))}document.querySelectorAll("[data-v],[data-open]").forEach(b=>b.onclick=()=>openView(b.dataset.v||b.dataset.open));
          fetch("config.json").then(r=>r.json()).then(c=>{cfg=c;const list=document.getElementById("sceneList"),frame=document.getElementById("warpFrame");c.droneScenes.forEach((s,i)=>{const b=document.createElement("button");b.className="scene"+(i===0?" on":"");b.textContent=String(i+1).padStart(2,"0")+" · "+s.title;b.onclick=()=>{document.querySelectorAll(".scene").forEach(x=>x.classList.remove("on"));b.classList.add("on");frame.src=s.src};list.appendChild(b)});frame.src=c.droneScenes[0].src});
          </script></body></html>'''
          Path("next/index.html").write_text(html,encoding="utf-8")
      - name: Next QA
        shell: python
        run: |
          from pathlib import Path
          import json
          h=Path("next/index.html").read_text(encoding="utf-8"); c=json.loads(Path("next/config.json").read_text())
          for x in ["Drone Warp Tour","Digital Twin","GSC Admin","Presentation","Preview & Publish","fetch(\"config.json\")"]: assert x in h,x
          assert len(c["droneScenes"])==7
          assert all(x["src"].startswith("https://drive.google.com/file/d/") for x in c["droneScenes"])
          assert Path("index.html").stat().st_size>1000000
          print("GSC Next QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Builder"
          git config user.email "actions@users.noreply.github.com"
          git add next
          git commit -m "Build GSC Next interactive preview"
          git pull --rebase origin next
          git push origin HEAD:next

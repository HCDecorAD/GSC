name: GSC Next Foundation
on:
  push:
    paths: ['.github/workflows/gsc-next-foundation.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create modular next foundation
        shell: python
        run: |
          from pathlib import Path
          Path("app").mkdir(exist_ok=True)
          Path("app/README.md").write_text("""# GSC Next
Modular rebuild isolated from production.
Modules: Public Viewer, Digital Twin, Drone Warp, Presentation, Admin CMS.
Production main remains untouched until acceptance tests pass.
""",encoding="utf-8")
          Path("app/app-config.json").write_text("""{
  "version":"next-1",
  "modules":{"viewer":true,"digitalTwin":true,"droneWarp":true,"presentation":true,"admin":true},
  "droneWarp":{"enabled":false,"autoplay":false,"scenes":["gate","reception","koi","wellness","pool","towers","rooftop"]},
  "admin":{"technicalConfigVisible":false}
}
""",encoding="utf-8")
          Path("app/drone-warp.js").write_text("""export const DRONE_SCENES=["gate","reception","koi","wellness","pool","towers","rooftop"];
export function validateDroneTour(scenes){return Array.isArray(scenes)&&scenes.every(x=>x&&x.id&&x.src)}
""",encoding="utf-8")
          Path("app/admin-model.js").write_text("""export const ADMIN_SECTIONS=["Dashboard","Hotspots","Drone Tour","Presentation","Media","App Settings"];
export const HIDDEN_TECHNICAL_FIELDS=["json","config","coordinates","rawDriveUrl"];
""",encoding="utf-8")
      - name: Foundation QA
        shell: python
        run: |
          from pathlib import Path
          import json
          c=json.loads(Path("app/app-config.json").read_text())
          assert c["modules"]["digitalTwin"] and c["modules"]["droneWarp"]
          assert c["admin"]["technicalConfigVisible"] is False
          assert len(c["droneWarp"]["scenes"])==7
          s=Path("index.html").read_text(encoding="utf-8")
          assert "GSC_LEGACY_TOPBAR_REMOVED_2026" in s and "gsc-config.json" in s
          print("Next foundation QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app
          git commit -m "Start modular GSC Next architecture"
          git pull --rebase origin next
          git push origin HEAD:next

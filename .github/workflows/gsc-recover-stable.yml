name: GSC Recovery Stable
on:
  push:
    paths: ['.github/workflows/gsc-recover-stable.yml']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified stable app
        run: |
          git checkout dc3c223871223e1b6d2b6a7269bb7b58b53e0bc5 -- index.html
      - name: Verify core app
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert len(s)>1000000
          req=["gsc-config.json","touchstart"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          print("Stable recovery checks passed",len(s))
      - name: Commit recovery
        run: |
          git config user.name "ChatGPT GSC Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Recover GSC to verified stable V6.3 core"
          git pull --rebase origin main
          git push

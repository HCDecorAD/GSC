name: GSC Remove Legacy Topbar
on:
  push:
    paths: ['.github/workflows/gsc-remove-legacy-topbar.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy top navigation at source
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          marker="GSC_LEGACY_TOPBAR_REMOVED_2026"
          if marker not in s:
            # Remove the actual legacy topbar markup containing TOÀN CẢNH / ANIMATION / +
            import re
            candidates=[]
            for tag in ("div","nav","header"):
              pat=re.compile(rf'<{tag}\b[^>]*>.*?</{tag}>',re.I|re.S)
              for m in pat.finditer(s):
                block=m.group(0)
                txt=re.sub(r'<[^>]+>',' ',block)
                if "TOÀN CẢNH" in txt and "ANIMATION" in txt and len(block)<12000:
                  candidates.append((m.start(),m.end(),block))
            if candidates:
              a,b,block=min(candidates,key=lambda x:len(x[2]))
              s=s[:a]+f'<!-- {marker}: legacy navigation removed -->'+s[b:]
            else:
              # Exact source-level fallback: neutralize controls themselves, never parent containers
              s=re.sub(r'(<(?:button|a)\b[^>]*>\s*(?:[^<]*?)TOÀN CẢNH(?:[^<]*?)</(?:button|a)>)',rf'<!-- {marker} -->',s,flags=re.I)
              s=re.sub(r'(<(?:button|a)\b[^>]*>\s*(?:[^<]*?)ANIMATION(?:[^<]*?)</(?:button|a)>)','',s,flags=re.I)
              # plus button only when it is a standalone top-nav control
              s=re.sub(r'<button\b([^>]*)>\s*\+\s*</button>','',s,flags=re.I)
              if marker not in s: s=s.replace("</body>",f"<!-- {marker}: controls neutralized -->\n</body>")
            p.write_text(s,encoding="utf-8")
      - name: Regression QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert len(s)>1000000
          req=["GSC_LEGACY_TOPBAR_REMOVED_2026","GSC_STABLE_UI_2026","gsc-config.json","touchstart","GIỚI THIỆU DỰ ÁN"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          assert "GSC_V10_ADMIN_CONSOLE" not in s
          print("Legacy topbar source removal QA passed",len(s))
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove legacy public top navigation"
          git pull --rebase origin main
          git push

name: GSC Responsive Safe Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add safe responsive layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          mark="GSC_RESPONSIVE_20260928"
          s=re.sub(r'<style id="'+mark+r'">.*?</style>','',s,flags=re.S)
          css='''<style id="GSC_RESPONSIVE_20260928">
html,body{width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none}
img,video,iframe{max-width:100%}
button,[role="button"],.hotspot{touch-action:manipulation}
#gscVideoUniversalClose{right:max(10px,env(safe-area-inset-right))!important;top:max(10px,env(safe-area-inset-top))!important}
@media(max-width:900px){#gscIntroStable{right:12px!important;bottom:max(12px,env(safe-area-inset-bottom))!important;max-width:calc(100vw - 24px)!important}}
@media(max-width:720px){#gscVideoUniversalClose{width:44px!important;height:44px!important;font-size:28px!important}iframe[src*="drive.google"],iframe[src*="youtube"],video{max-width:100vw!important;max-height:100dvh!important}}
@media(orientation:landscape) and (max-height:600px){#gscIntroStable{max-width:44vw!important;bottom:8px!important;right:8px!important}#gscVideoUniversalClose{top:8px!important;right:8px!important}}
</style>'''
          if "</head>" not in s: raise SystemExit("missing </head>")
          s=s.replace("</head>",css+"</head>")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Regression QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert len(s)>1000000
          assert "GSC_RESPONSIVE_20260928" in s
          assert "gsc-config.json" in s
          assert "gscVideoUniversalClose" in s
          print("PASS")
          PY
      - name: Commit patch
        run: |
          git config user.name "HCDecor GSC Release"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply safe responsive layer"
          git pull --rebase origin main
          git push

name: GSC UI Fix Intro Video Close
on:
  push:
    paths: ['.github/workflows/gsc-ui-fix-intro-video.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production UI safely
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          mark="GSC_UI_FIX_20260926"
          if mark not in s:
            patch=r'''
<style id="GSC_UI_FIX_20260926">
/* Keep presentation CTA away from the project brand/logo area */
#gscIntroStable{
  top:auto!important;
  left:auto!important;
  right:18px!important;
  bottom:18px!important;
  z-index:8500!important;
  max-width:calc(100vw - 36px)!important;
}
@media(max-width:720px){
  #gscIntroStable{right:12px!important;bottom:12px!important;left:auto!important;top:auto!important}
}
/* universal close affordance for video overlays */
.gsc-video-x{
 position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));
 width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
 background:rgba(0,0,0,.72);color:#fff;font:700 26px/40px Arial;text-align:center;
 z-index:2147483646;cursor:pointer;backdrop-filter:blur(8px);display:none
}
.gsc-video-x.on{display:block}
</style>
<button id="gscVideoUniversalClose" class="gsc-video-x" aria-label="Đóng video" title="Đóng video">×</button>
<script>
(function(){
 const x=document.getElementById('gscVideoUniversalClose');
 const mediaSel='iframe[src*="drive.google"],iframe[src*="youtube"],video';
 function visible(el){if(!el)return false;const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return r.width>80&&r.height>80&&cs.display!=='none'&&cs.visibility!=='hidden'}
 function sync(){x.classList.toggle('on',[...document.querySelectorAll(mediaSel)].some(visible))}
 function closeMedia(){
   document.querySelectorAll(mediaSel).forEach(m=>{
     if(m.tagName==='VIDEO'){try{m.pause()}catch(e){}}
     else if(m.src){m.dataset.gscClosedSrc=m.src;m.src='about:blank'}
   });
   /* Prefer existing close controls so original modal state is preserved */
   const candidates=[...document.querySelectorAll('button,[role="button"],.close,[class*="close"]')].filter(e=>e!==x&&visible(e));
   const native=candidates.find(e=>/^(×|x|đóng|close)$/i.test((e.textContent||'').trim())||/đóng|close/i.test(e.getAttribute('aria-label')||''));
   if(native) native.click();
   else {
     document.querySelectorAll('[class*="modal"],[class*="video"],[id*="modal"],[id*="video"]').forEach(e=>{
       if(e.contains(x)||e===x)return;
       if(e.querySelector&&e.querySelector(mediaSel)&&visible(e)) e.style.display='none';
     });
   }
   x.classList.remove('on');
 }
 x.addEventListener('click',closeMedia);
 new MutationObserver(()=>requestAnimationFrame(sync)).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class','src']});
 document.addEventListener('click',()=>setTimeout(sync,80),true);
 window.addEventListener('resize',sync); setInterval(sync,1200); sync();
})();
</script>
'''
            s=s.replace("</body>",patch+"\n</body>")
            p.write_text(s,encoding="utf-8")
      - name: Regression QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert len(s)>1000000
          for x in ["GSC_UI_FIX_20260926","gscIntroStable","gscVideoUniversalClose","gsc-config.json","touchstart","GSC_LEGACY_TOPBAR_REMOVED_2026"]: assert x in s,x
          assert "right:18px!important" in s and "bottom:18px!important" in s
          print("UI FIX QA PASS")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Move project intro CTA and add universal video close"
          git pull --rebase origin main
          git push origin HEAD:main

name: GSC V10 Admin Console
on:
  push:
    paths: ['.github/workflows/gsc-v10-admin.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Admin Console
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if "GSC_V10_ADMIN_CONSOLE" not in s:
            patch=r"""
            <style id="GSC_V10_ADMIN_CONSOLE">
            body.gsc-v10-admin #gscStoryBtn{display:none!important}
            body.gsc-v10-admin .topbar,body.gsc-v10-admin #topbar{display:none!important}
            .gsc-v10-legacy-admin{display:none!important}
            #gscAdmin10{position:fixed;inset:0;z-index:24000;background:#07100f;color:#eef3ef;font:14px/1.4 Segoe UI,Arial,sans-serif;display:none}
            #gscAdmin10.on{display:grid;grid-template-columns:250px 1fr}
            .a10side{background:#091513;border-right:1px solid #d5b96c2e;padding:20px 14px;overflow:auto}.a10brand{font-size:18px;font-weight:800;color:#d5b96c;margin:3px 8px 24px}.a10brand small{display:block;font-size:10px;color:#80908b;letter-spacing:.16em;margin-top:5px}
            .a10nav button{display:block;width:100%;border:0;background:transparent;color:#aebbb7;padding:12px;border-radius:9px;text-align:left;margin:3px 0}.a10nav button.on,.a10nav button:hover{background:#d5b96c12;color:#e4cb88}.a10foot{position:absolute;bottom:16px;left:14px;width:220px}.a10foot button{width:100%;padding:11px;border-radius:9px;border:1px solid #ffffff18;background:#ffffff08;color:#fff}
            .a10main{overflow:auto;padding:24px}.a10top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.a10top h2{margin:0;font-size:22px}.a10badge{font-size:11px;color:#8ea39c;border:1px solid #ffffff18;border-radius:99px;padding:7px 10px}
            .a10page{display:none}.a10page.on{display:block}.a10grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.a10card{background:#0c1917;border:1px solid #ffffff12;border-radius:14px;padding:16px}.a10card b{display:block;color:#d9c17e;margin-bottom:6px}.a10card p{color:#91a09b;margin:0;font-size:12px}
            .a10toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.a10btn{border:1px solid #d5b96c45;background:#d5b96c10;color:#e3c97f;border-radius:9px;padding:9px 12px}.a10list{background:#0b1715;border:1px solid #ffffff12;border-radius:14px;overflow:hidden}.a10row{display:grid;grid-template-columns:45px 1.2fr .8fr 90px;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #ffffff0c}.a10row:last-child{border:0}.a10row input{width:100%;box-sizing:border-box;background:#07100f;border:1px solid #ffffff16;color:#fff;border-radius:7px;padding:8px}.a10state{color:#7fd0a3;font-size:11px}
            .a10note{padding:12px 14px;border-radius:10px;background:#d5b96c0d;color:#a9b6b2;margin-bottom:14px;font-size:12px}
            @media(max-width:720px){#gscAdmin10.on{grid-template-columns:72px 1fr}.a10brand{font-size:0;margin:3px 0 18px;text-align:center}.a10brand:before{content:"GSC";font-size:14px}.a10brand small{display:none}.a10nav button{font-size:0;text-align:center;padding:13px 4px}.a10nav button:before{font-size:18px}.a10nav button[data-p="dash"]:before{content:"⌂"}.a10nav button[data-p="hot"]:before{content:"◎"}.a10nav button[data-p="story"]:before{content:"▶"}.a10nav button[data-p="media"]:before{content:"▣"}.a10nav button[data-p="app"]:before{content:"⚙"}.a10foot{left:7px;width:58px}.a10foot button{font-size:0}.a10foot button:before{content:"×";font-size:20px}.a10main{padding:15px 10px}.a10grid{grid-template-columns:1fr}.a10row{grid-template-columns:35px 1fr 62px}.a10row input:nth-of-type(2){display:none}.a10top h2{font-size:18px}}
            </style>
            <section id="gscAdmin10">
              <aside class="a10side"><div class="a10brand">GSC ADMIN<small>CONTENT & EXPERIENCE</small></div><nav class="a10nav">
                <button class="on" data-p="dash">Tổng quan</button><button data-p="hot">Hotspots</button><button data-p="story">Giới thiệu dự án</button><button data-p="media">Media</button><button data-p="app">Ứng dụng</button>
              </nav><div class="a10foot"><button id="a10Exit">Đóng Admin</button></div></aside>
              <main class="a10main"><div class="a10top"><h2 id="a10Title">Tổng quan</h2><span class="a10badge">GSC · LIVE</span></div>
                <div class="a10page on" data-page="dash"><div class="a10grid"><div class="a10card"><b>Digital Twin</b><p>Quản lý masterplan, hotspot và trải nghiệm tương tác.</p></div><div class="a10card"><b>Drone Warp Tour</b><p>Module tour điện ảnh đang sẵn sàng để gắn các scene video.</p></div><div class="a10card"><b>Presentation</b><p>Quản lý nội dung phần Giới thiệu dự án.</p></div></div></div>
                <div class="a10page" data-page="hot"><div class="a10note">Chỉnh nhanh tên và trạng thái hotspot. Link video hiện được quản lý nội bộ, không hiển thị bảng cấu hình kỹ thuật.</div><div class="a10toolbar"><button class="a10btn" id="a10Add">＋ Hotspot</button><button class="a10btn" id="a10Drag">Kéo vị trí</button></div><div class="a10list" id="a10Hot"></div></div>
                <div class="a10page" data-page="story"><div class="a10grid"><div class="a10card"><b>01 · Ấn tượng</b><p>Hero / mở đầu dự án.</p></div><div class="a10card"><b>02 · Hiểu dự án</b><p>Quy mô và quy hoạch.</p></div><div class="a10card"><b>03 · Khám phá</b><p>Tiện ích và Digital Twin.</p></div><div class="a10card"><b>04 · Tin tưởng</b><p>Chăm sóc và dịch vụ.</p></div><div class="a10card"><b>05 · Hành động</b><p>Đi vào trải nghiệm tương tác.</p></div></div></div>
                <div class="a10page" data-page="media"><div class="a10note">Media được dùng cho hotspot, presentation và Drone Warp. Không yêu cầu người quản trị thao tác với JSON/config.</div><div class="a10grid"><div class="a10card"><b>Video Hotspot</b><p>Google Drive media hiện có.</p></div><div class="a10card"><b>Drone Warp Scenes</b><p>Gate → Reception → Koi → Wellness → Pool → Towers → Rooftop.</p></div><div class="a10card"><b>Ảnh dự án</b><p>Hero, masterplan và tiện ích.</p></div></div></div>
                <div class="a10page" data-page="app"><div class="a10grid"><div class="a10card"><b>Public Viewer</b><p>Giao diện khách xem, mobile-first.</p></div><div class="a10card"><b>Presentation</b><p>Bật/tắt và quản lý hành trình giới thiệu.</p></div><div class="a10card"><b>Drone Warp</b><p>Quản lý thứ tự scene và Auto Tour.</p></div></div></div>
              </main>
            </section>
            <script>
            (()=>{const GSC_V10_ADMIN_CONSOLE=true,q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],A=q("#gscAdmin10");
            const names={dash:"Tổng quan",hot:"Hotspots",story:"Giới thiệu dự án",media:"Media",app:"Ứng dụng"};
            function markLegacy(){qa("div,section,aside").forEach(el=>{let t=(el.textContent||"").toUpperCase();if(t.includes("SIMPLE ADMIN")&&t.includes("XUẤT CẤU HÌNH")&&t.includes("ĐĂNG XUẤT"))el.classList.add("gsc-v10-legacy-admin")})}
            function open10(){markLegacy();document.body.classList.add("gsc-v10-admin");A.classList.add("on");renderHot()}
            function close10(){A.classList.remove("on");document.body.classList.remove("gsc-v10-admin");qa(".gsc-v10-legacy-admin").forEach(x=>x.classList.remove("gsc-v10-legacy-admin"))}
            qa(".a10nav button").forEach(b=>b.onclick=()=>{qa(".a10nav button,.a10page").forEach(x=>x.classList.remove("on"));b.classList.add("on");q('[data-page="'+b.dataset.p+'"]').classList.add("on");q("#a10Title").textContent=names[b.dataset.p]});
            q("#a10Exit").onclick=close10;
            function renderHot(){let box=q("#a10Hot");if(!box)return;box.innerHTML="";for(let i=1;i<=11;i++){let row=document.createElement("div");row.className="a10row";row.innerHTML='<b>'+String(i).padStart(2,"0")+'</b><input value="Hotspot '+String(i).padStart(2,"0")+'" aria-label="Tên hotspot"><input placeholder="Media đã liên kết" aria-label="Media"><span class="a10state">● ON</span>';box.appendChild(row)}}
            const obs=new MutationObserver(()=>{let legacy=qa("div,section,aside").find(el=>{let t=(el.textContent||"").toUpperCase();return t.includes("SIMPLE ADMIN")&&t.includes("XUẤT CẤU HÌNH")&&t.includes("ĐĂNG XUẤT")&&getComputedStyle(el).display!=="none"});if(legacy&&!A.classList.contains("on"))open10()});obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["class","style"]});
            window.addEventListener("gsc-admin-authenticated",open10);markLegacy();
            })();
            </script>
            """
            s=s.replace("</body>",patch+"\n</body>")
            p.write_text(s,encoding="utf-8")
      - name: Regression QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          req=["GSC_V10_ADMIN_CONSOLE","gscAdmin10","Tổng quan","Hotspots","Giới thiệu dự án","Media","Drone Warp","Ứng dụng","gsc-v10-legacy-admin","GSC_V9_UX_CLEAN","GSC_V8_PUBLIC","gsc-config.json","touchstart"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          assert s.count('id="GSC_V10_ADMIN_CONSOLE"')==1
          print("V10 Admin Console QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "GSC V10 professional Admin Console"
          git pull --rebase origin main
          git push

name: GSC V7.1 cinematic media
on:
  push:
    paths: ['.github/workflows/gsc-v71-media.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cinematic media to story
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if "GSC_V71_MEDIA" not in s:
            css='<style id="GSC_V71_MEDIA">.gscMedia{width:100%;aspect-ratio:16/9;margin:18px 0 2px;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 12px 38px #0008}.gscMedia iframe{width:100%;height:100%;border:0;display:block}@media(max-height:650px) and (orientation:landscape){.gscCard{max-height:94dvh;overflow:auto}.gscMedia{width:min(48vw,520px);margin:10px 0}}</style>'
            s=s.replace("</head>",css+"\n</head>")
            s=s.replace('<div class="gscText" id="gscText"></div>','<div class="gscText" id="gscText"></div><div class="gscMedia" id="gscMedia"></div>')
            s=s.replace('(()=>{const data=[','(()=>{const GSC_V71_MEDIA=true;const media=["18r8ADfI6NKrLKOkTheuJ91fBnifbYgNJ","1BMgtO93Kwr90AdS9uH0ueGAv5DHdX0E4","1cZVjsaQUPYN89IEI4u0L-wt9-ndaKzmN","1g0mAVPZzEMeLk1QSDyX6gLhwMIqg-Qfm","1OgiVVHld9esVkVO2QgwCNdVMKmhVzcSF"];const data=[')
            old='q("gscNext").textContent=i===data.length-1?"Khám phá ngay":"Tiếp tục →"}'
            new='q("gscNext").textContent=i===data.length-1?"Khám phá ngay":"Tiếp tục →";const m=q("gscMedia");m.innerHTML=media[i]?("<iframe src=\"https://drive.google.com/file/d/"+media[i]+"/preview\" allow=\"autoplay; fullscreen\" loading=\"lazy\"></iframe>"):""}'
            s=s.replace(old,new)
            p.write_text(s,encoding="utf-8")
      - name: Regression QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          req=["GSC_V71_MEDIA","GSC_V7_EXPERIENCE","GSC_V63_RESPONSIVE","GSC_V62_ROTATION_FIX","gscMedia","drive.google.com/file/d/","touchstart","gsc-config.json"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          print("V7.1 QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "GSC V7.1 cinematic story media"
          git pull --rebase origin main
          git push

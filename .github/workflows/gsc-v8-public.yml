name: GSC V8 Public Experience
on:
  push:
    paths: ['.github/workflows/gsc-v8-public.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V8 public experience
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if "GSC_V8_PUBLIC" not in s:
            patch=r"""
            <style id="GSC_V8_PUBLIC">
            /* Public navigation: hide legacy tabs by explicit content hook via JS */
            .gsc-public-hidden{display:none!important}
            #gscV8Intro{position:fixed;inset:0;z-index:15000;background:#05090c;color:#fff;font-family:Segoe UI,sans-serif;display:none;overflow:auto}
            #gscV8Intro.on{display:block}.v8Hero{min-height:100dvh;position:relative;display:grid;place-items:end start;padding:clamp(28px,7vw,90px);box-sizing:border-box;background:linear-gradient(0deg,#05090cf2 0%,#05090c55 55%,#05090caa 100%)}
            .v8Hero:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#15221f,#060a0d 62%);z-index:-2}.v8Hero:after{content:"GSC";position:absolute;right:4vw;top:8vh;font-size:min(28vw,360px);font-weight:800;color:#ffffff05;z-index:-1}
            .v8Copy{max-width:820px}.v8Kicker{color:#d2b679;letter-spacing:.18em;font-size:12px}.v8Title{font-size:clamp(40px,8vw,92px);line-height:.96;margin:14px 0}.v8Lead{font-size:clamp(16px,2.2vw,22px);line-height:1.55;color:#d7dde2;max-width:680px}
            .v8Actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.v8Btn{border:1px solid #ffffff35;background:#ffffff0d;color:#fff;padding:13px 18px;border-radius:999px;min-height:46px}.v8Btn.gold{background:#c9ad76;color:#101317;border-color:#c9ad76;font-weight:700}
            .v8Close{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff2b;background:#0b1117cc;color:#fff;font-size:24px}
            .v8Progress{position:fixed;left:50%;top:calc(17px + env(safe-area-inset-top));transform:translateX(-50%);z-index:2;display:flex;gap:7px}.v8Dot{width:28px;height:3px;background:#ffffff28}.v8Dot.on{background:#c9ad76}
            #gscStoryBtn{top:calc(14px + env(safe-area-inset-top))!important;right:14px!important;bottom:auto!important}
            @media(max-width:650px){.v8Hero{padding:80px 22px 34px}.v8Title{font-size:42px}.v8Progress{left:18px;transform:none}.v8Dot{width:18px}}
            </style>
            <section id="gscV8Intro" aria-label="Giới thiệu dự án"><button class="v8Close" id="v8Close">×</button><div class="v8Progress" id="v8Progress"></div><div class="v8Hero"><div class="v8Copy"><div class="v8Kicker" id="v8Kicker"></div><h1 class="v8Title" id="v8Title"></h1><div class="v8Lead" id="v8Lead"></div><div class="v8Actions"><button class="v8Btn" id="v8Prev">← Trước</button><button class="v8Btn gold" id="v8Next">Tiếp tục →</button></div></div></div></section>
            <script>
            (()=>{const GSC_V8_PUBLIC=true;
            function hideLegacy(){document.querySelectorAll("button,a,div,span").forEach(el=>{if(el.children.length>3)return;let t=(el.textContent||"").trim().toUpperCase();if(t==="TOÀN CẢNH"||t==="ANIMATION"||t==="+"){let box=el.closest("button,a,.tab,.top-tab")||el;box.classList.add("gsc-public-hidden")}})}
            hideLegacy();new MutationObserver(hideLegacy).observe(document.body,{childList:true,subtree:true});
            const slides=[
            ["ẤN TƯỢNG","GSC Senior Living & Wellness","Nơi tuổi vàng bắt đầu một chương mới. Một môi trường sống được kiến tạo cho sự an tâm, kết nối và tận hưởng mỗi ngày."],
            ["HIỂU DỰ ÁN","Một hệ sinh thái sống trọn vẹn","Dự án quy hoạch trên khu đất khoảng 20.000 m² với hai tháp 36 tầng, kết nối không gian sống, chăm sóc sức khỏe, dịch vụ và cảnh quan."],
            ["KHÁM PHÁ","Mỗi điểm chạm là một trải nghiệm","Khám phá cổng chính, hồ Koi, khu vận động, hồ bơi, không gian hoạt động tầng 3, sân thượng, trồng trọt và các tiện ích qua Digital Twin tương tác."],
            ["TIN TƯỞNG","Chăm sóc được đặt ở trung tâm","Hệ tiện ích định hướng gồm reception, nhà thuốc, vật lý trị liệu, y tế – cấp cứu, siêu thị và các không gian cộng đồng dành cho người cao tuổi."],
            ["HÀNH ĐỘNG","Tự mình khám phá GSC","Chạm vào từng hotspot trên tổng thể dự án, xem video thực tế và sử dụng pinch zoom để đi sâu vào từng không gian."]
            ];let i=0;const q=x=>document.getElementById(x),modal=q("gscV8Intro");
            function draw(){let a=slides[i];q("v8Kicker").textContent=("0"+(i+1)).slice(-2)+" · "+a[0];q("v8Title").textContent=a[1];q("v8Lead").textContent=a[2];q("v8Prev").style.visibility=i?"visible":"hidden";q("v8Next").textContent=i===slides.length-1?"KHÁM PHÁ DIGITAL TWIN":"Tiếp tục →";q("v8Progress").innerHTML=slides.map((_,n)=>'<i class="v8Dot '+(n===i?'on':'')+'"></i>').join("")}
            function open(){i=0;draw();modal.classList.add("on");document.body.style.overflow="hidden"}function close(){modal.classList.remove("on");document.body.style.overflow=""}
            q("v8Close").onclick=close;q("v8Prev").onclick=()=>{if(i){i--;draw()}};q("v8Next").onclick=()=>{if(i<slides.length-1){i++;draw()}else close()};
            const old=q("gscStoryBtn");if(old){old.onclick=open;old.textContent="▶ GIỚI THIỆU DỰ ÁN"}
            })();
            </script>
            """
            s=s.replace("</body>",patch+"\n</body>")
            p.write_text(s,encoding="utf-8")
      - name: Functional static QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          req=["GSC_V8_PUBLIC","gscV8Intro","hideLegacy","TOÀN CẢNH","ANIMATION","ẤN TƯỢNG","HIỂU DỰ ÁN","KHÁM PHÁ","TIN TƯỞNG","HÀNH ĐỘNG","GSC_V73_STUDIO_PRO","gsc-config.json","touchstart"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          assert s.count('id="GSC_V8_PUBLIC"')==1
          print("V8 public experience QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "GSC V8 public presentation experience"
          git pull --rebase origin main
          git push

name: GSC V8.1 Public UI Fix
on:
  push:
    paths: ['.github/workflows/gsc-v81-ui.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply public UI fixes
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if "GSC_V81_UI_FIX" not in s:
            patch=r"""
            <style id="GSC_V81_UI_FIX">
            /* Public UI: legacy nav and bottom instruction are removed regardless of old class names */
            body:not(.gsc-admin-mode) .gsc-v81-hide{display:none!important}
            #gscStoryBtn{left:14px!important;right:auto!important;top:calc(14px + env(safe-area-inset-top))!important;bottom:auto!important;max-width:calc(100vw - 86px)!important;z-index:7600!important}
            #viewer.on~#gscStoryBtn,#viewer[style*="display: flex"]~#gscStoryBtn{opacity:0!important;pointer-events:none!important}
            @media(max-width:600px){#gscStoryBtn{left:10px!important;padding:10px 13px!important;font-size:11px!important}}
            </style>
            <script>
            (()=>{const GSC_V81_UI_FIX=true;
            const norm=s=>(s||"").replace(/\s+/g," ").trim().toUpperCase();
            function cleanPublic(){
              if(document.body.classList.contains("gsc-admin-mode"))return;
              document.querySelectorAll("button,a,div,span").forEach(el=>{
                const t=norm(el.textContent);
                if((t==="TOÀN CẢNH"||t==="ANIMATION"||t==="+") && el.children.length<4){
                  (el.closest("button,a,.tab,.top-tab")||el).classList.add("gsc-v81-hide");
                }
                if((/KÉO ĐỂ DI CHUYỂN/.test(t)&&/ZOOM/.test(t))||(/CLICK HOTSPOT/.test(t)&&/VIDEO/.test(t))){
                  el.classList.add("gsc-v81-hide");
                }
              });
            }
            cleanPublic();setTimeout(cleanPublic,100);setTimeout(cleanPublic,600);
            new MutationObserver(cleanPublic).observe(document.body,{childList:true,subtree:true,characterData:true});
            const viewer=document.getElementById("viewer"),story=document.getElementById("gscStoryBtn");
            function storySafe(){if(!viewer||!story)return;const cs=getComputedStyle(viewer),open=cs.display!=="none"&&cs.visibility!=="hidden"&&(viewer.classList.contains("on")||viewer.querySelector("iframe,video"));story.style.visibility=open?"hidden":"visible"}
            if(viewer){new MutationObserver(storySafe).observe(viewer,{attributes:true,childList:true,subtree:true});storySafe()}
            })();
            </script>
            """
            s=s.replace("</body>",patch+"\n</body>")
            p.write_text(s,encoding="utf-8")
      - name: Regression QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          req=["GSC_V81_UI_FIX","GSC_V8_PUBLIC","GSC_V73_STUDIO_PRO","TOÀN CẢNH","ANIMATION","KÉO ĐỂ DI CHUYỂN","gsc-v81-hide","left:14px","storySafe","gsc-config.json","touchstart"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          assert s.count('id="GSC_V81_UI_FIX"')==1
          print("V8.1 UI regression QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "GSC V8.1 fix public navigation and mobile controls"
          git pull --rebase origin main
          git push

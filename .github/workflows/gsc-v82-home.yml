name: GSC V8.2 Homepage Recovery
on:
  push:
    paths: ['.github/workflows/gsc-v82-home.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage visibility
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          if "GSC_V82_HOME_RECOVERY" not in s:
            patch=r"""
            <style id="GSC_V82_HOME_RECOVERY">
            /* Recovery: never hide structural containers when removing old nav */
            body:not(.gsc-admin-mode) .gsc-v82-hide{display:none!important}
            #project,#stage,#view,.project,.stage,.view{visibility:visible!important;opacity:1!important}
            </style>
            <script>
            (()=>{const GSC_V82_HOME_RECOVERY=true,n=s=>(s||"").replace(/\s+/g," ").trim().toUpperCase();
            function recover(){
              document.querySelectorAll(".gsc-v81-hide,.gsc-public-hidden").forEach(x=>x.classList.remove("gsc-v81-hide","gsc-public-hidden"));
              if(document.body.classList.contains("gsc-admin-mode"))return;
              document.querySelectorAll("button,a").forEach(el=>{const t=n(el.textContent);if(t==="TOÀN CẢNH"||t==="ANIMATION"||t==="+")el.classList.add("gsc-v82-hide")});
              document.querySelectorAll("div,span,p").forEach(el=>{const t=n(el.textContent);if(el.children.length===0&&((t.includes("KÉO ĐỂ DI CHUYỂN")&&t.includes("ZOOM"))||(t.includes("CLICK HOTSPOT")&&t.includes("VIDEO"))))el.classList.add("gsc-v82-hide")});
            }
            recover();setTimeout(recover,100);setTimeout(recover,700);
            new MutationObserver(recover).observe(document.body,{childList:true,subtree:true});
            })();
            </script>
            """
            s=s.replace("</body>",patch+"\n</body>")
            p.write_text(s,encoding="utf-8")
      - name: Regression QA
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          req=["GSC_V82_HOME_RECOVERY","GSC_V81_UI_FIX","GSC_V8_PUBLIC","GSC_V73_STUDIO_PRO","gsc-v82-hide","#project","#stage","#view","gsc-config.json","touchstart"]
          miss=[x for x in req if x not in s]; assert not miss,miss
          assert s.count('id="GSC_V82_HOME_RECOVERY"')==1
          print("V8.2 homepage recovery QA passed")
      - name: Commit
        run: |
          git config user.name "ChatGPT GSC Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "GSC V8.2 recover homepage while hiding legacy controls"
          git pull --rebase origin main
          git push

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "CMS update: {path}"
      create: "CMS create: {path}"
      delete: "CMS delete: {path}"
      rename: "CMS rename: {oldPath} -> {newPath}"
media:
  input: assets/cms
  output: /assets/cms
  categories: [image]


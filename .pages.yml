settings:
  content: { merge: true }
  commit:
    identity: user
media:
  input: assets/cms
  output: /assets/cms
  categories: [image]
content:
  - name: introduction
    label: Nội dung giới thiệu
    type: file
    path: config/intro.json
    format: json
    operations: { delete: false }
    fields:
      - name: hero
        label: Mở đầu
        type: object
        fields:
          - { name: title, label: Tiêu đề, type: string }
          - { name: lead, label: Mô tả, type: text }
      - name: sections
        label: Các section
        type: object
        list: { min: 1, max: 12, collapsible: { collapsed: true, summary: "{title}" } }
        fields:
          - { name: id, label: ID kỹ thuật, type: string, readonly: true }
          - { name: enabled, label: Hiển thị, type: boolean }
          - { name: order, label: Thứ tự, type: number }
          - { name: title, label: Tiêu đề, type: string }
          - { name: text, label: Nội dung, type: text }
          - { name: image, label: Hình ảnh, type: image }

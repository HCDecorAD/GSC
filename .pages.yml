          - { name: title, label: Tiêu đề, type: string }
          - { name: lead, label: Mô tả, type: text }
      - name: sections
        label: Section
        type: object
        list:
          min: 1
          max: 12
          collapsible: { collapsed: true, summary: "{title}" }
        fields:

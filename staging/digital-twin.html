<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSC — Digital Twin 3D Preview</title><style>body{margin:0;background:#102c32;color:#f5eddb;font:16px Arial,sans-serif}header{padding:18px 26px;display:flex;justify-content:space-between;align-items:center}a{color:#e6c489}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);min-height:80vh}#scene{width:100%;height:70vh;touch-action:none}aside{padding:25px;background:#193b41}button{padding:12px;margin:5px;background:#e6c489;border:0;border-radius:4px;cursor:pointer}p{line-height:1.6}@media(max-width:700px){main{display:block}#scene{height:55vh}}</style></head><body><header><strong>GSC / DIGITAL TWIN</strong><a href="../index.html">← Website</a></header><main><div id="scene" aria-label="Mô hình kiến trúc 3D minh họa; có thể xoay và phóng to"></div><aside><h1>Khám phá GSC 3D</h1><p>Mô hình khối kiến trúc minh họa, không phải bản vẽ hoặc thiết kế công trình thực tế.</p><div><button id="reset">Đặt lại góc nhìn</button><button id="zoomIn">Phóng to +</button><button id="zoomOut">Thu nhỏ −</button></div><h2>Khu vực</h2><div id="spots"></div><p id="status" role="status">Kéo để xoay, cuộn để thu phóng.</p><p><a href="../overview.html">Tổng quan</a> · <a href="../architecture.html">Kiến trúc</a> · <a href="../amenities.html">Tiện ích</a></p></aside></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const root=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#102c32');
const camera=new THREE.PerspectiveCamera(45,1,.1,500);camera.position.set(26,21,30);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x425a48,2));const sun=new THREE.DirectionalLight(0xffe6b0,3);sun.position.set(12,30,20);scene.add(sun);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=10;controls.maxDistance=90;controls.maxPolarAngle=Math.PI/2.05;
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.65});
const ground=new THREE.Mesh(new THREE.BoxGeometry(48,.3,38),mat('#55735c'));ground.position.y=-.3;scene.add(ground);
const towers=[{id:'A',x:-9,z:0,h:17},{id:'B',x:5,z:-4,h:22},{id:'C',x:9,z:8,h:13}];
for(const t of towers){const group=new THREE.Group();const core=new THREE.Mesh(new THREE.BoxGeometry(7,t.h,7),mat('#e5d9bd'));core.position.y=t.h/2;group.add(core);for(let y=1.5;y<t.h;y+=2.2){const trim=new THREE.Mesh(new THREE.BoxGeometry(7.5,.25,7.5),mat('#b99355'));trim.position.y=y;group.add(trim)}const roof=new THREE.Mesh(new THREE.BoxGeometry(8,.6,8),mat('#55745c'));roof.position.y=t.h+.3;group.add(roof);group.position.set(t.x,0,t.z);group.userData.id=t.id;scene.add(group)}
const pool=new THREE.Mesh(new THREE.CylinderGeometry(5,5,.06,40),new THREE.MeshStandardMaterial({color:'#5bc0c6',metalness:.3,roughness:.15}));pool.scale.z=.65;pool.position.set(-1,.03,10);scene.add(pool);
const spots=document.getElementById('spots'),status=document.getElementById('status');
towers.forEach(t=>{const b=document.createElement('button');b.textContent='Tháp '+t.id;b.onclick=()=>{controls.target.set(t.x,t.h/2,t.z);camera.position.set(t.x+13,t.h/2+12,t.z+17);status.textContent='Đang xem tháp '+t.id+' (minh họa)';save()};spots.appendChild(b)});
function save(){sessionStorage.setItem('gsc3d',JSON.stringify({camera:camera.position.toArray(),target:controls.target.toArray()}))}
function reset(){controls.target.set(0,8,0);camera.position.set(26,21,30);controls.update();save()}
document.getElementById('reset').onclick=reset;document.getElementById('zoomIn').onclick=()=>{camera.position.multiplyScalar(.82);save()};document.getElementById('zoomOut').onclick=()=>{camera.position.multiplyScalar(1.2);save()};
try{const s=JSON.parse(sessionStorage.getItem('gsc3d'));if(s?.camera?.length===3&&s?.target?.length===3){camera.position.fromArray(s.camera);controls.target.fromArray(s.target)}}catch{}
controls.addEventListener('end',save);
function resize(){const w=root.clientWidth,h=root.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}addEventListener('resize',resize);resize();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)controls.enableDamping=false;
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
